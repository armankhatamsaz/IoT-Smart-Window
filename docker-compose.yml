version: '3.8'

services:
  # 1. سرور رجیستری (کاتالوگ)
  registry:
    build: ./registry
    container_name: smarthome_registry
    ports:
      - "8080:8080"
    command: python main.py

  # 2. کانکتور پذیرایی (Living Room)
  gateway_livingroom:
    build: ./gateway
    container_name: smarthome_gw_livingroom
    environment:
      - CONFIG_FILE=settings_livingroom.json
    depends_on:
      - registry

  # 3. کانکتور اتاق خواب 1 (Bedroom 1)
  gateway_bedroom1:
    build: ./gateway
    container_name: smarthome_gw_bedroom1
    environment:
      - CONFIG_FILE=settings_bedroom1.json
    depends_on:
      - registry

  # 4. کانکتور اتاق خواب 2 (Bedroom 2)
  gateway_bedroom2:
    build: ./gateway
    container_name: smarthome_gw_bedroom2
    environment:
      - CONFIG_FILE=settings_bedroom2.json
    depends_on:
      - registry

  # 5. کانکتور محیط بیرون (Outdoor)
  gateway_outdoor:
    build: ./gateway
    container_name: smarthome_gw_outdoor
    environment:
      - CONFIG_FILE=settings_outdoor.json
    depends_on:
      - registry

  # 6. مغز متفکر (Analyzer) - آدرس پوشه اصلاح شد
  analyzer:
    build: ./control_logic
    container_name: smarthome_analyzer
    command: python analyzer.py
    depends_on:
      - registry

  # 7. ربات تلگرام
  telegram_bot:
    build: ./telegram_bot
    container_name: smarthome_bot
    command: python bot.py
    depends_on:
      - registry

  # 8. آداپتور ThingSpeak - آدرس پوشه اصلاح شد
  adaptor:
    build: ./thingspeak_adaptor
    container_name: smarthome_adaptor
    command: python adaptor.py
    depends_on:
      - registry

  # 9. وب‌سرور برای اجرای دشبورد
  dashboard:
    image: python:3.9-slim
    container_name: smarthome_dashboard
    working_dir: /app
    volumes:
      - ./dashboard:/app
    ports:
      - "80:8000"
    command: python -m http.server 8000